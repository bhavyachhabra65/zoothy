<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Dynamic Title -->
    <title>
        {% block title %}{% endblock %} • Zoothy
    </title>

    <!-- Favicon -->
    <link rel="icon"
          href="{{ url_for('static', filename='images/favicon.ico') }}">

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/variables.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/layout.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/components.css') }}">

    {% block styles %}{% endblock %}

</head>

<body>

<div class="z-page">

      <main class="z-container {% block main_class %}{% endblock %}">

      {% block content %}
      {% endblock %}

      </main>
</div>

{% block footer %}

<footer class="z-footer">

    <p>Zoothy • Free Accounting</p>

    <p>Built with ❤️ for every entrepreneur.</p>

</footer>

{% endblock %}

<!-- Global JS -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>

<!-- Initialize Lucide -->
<script>
    lucide.createIcons();
</script>

{% block scripts %}{% endblock %}

</body>

</html>
