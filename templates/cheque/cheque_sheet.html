<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Print Cheque • Zoothy</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/cheque.css') }}"
    >

</head>

<body onload="window.print()">

<div class="cheque">

    <div
        class="field"
        style="
            top:{{ layout.DATE.top }}mm;
            left:{{ layout.DATE.left }}mm;
        "
    >
        {{ cheque.formatted_date }}
    </div>

    <div
        class="field"
        style="
            top:{{ layout.PAYEE.top }}mm;
            left:{{ layout.PAYEE.left }}mm;
        "
    >
        {{ cheque.pay_to }}
    </div>

    <div
        class="field amount"
        style="
            top:{{ layout.AMOUNT.top }}mm;
            left:{{ layout.AMOUNT.left }}mm;
        "
    >
        ₹{{ "%.2f"|format(cheque.amount) }}
    </div>

    <div
        class="field"
        style="
            top:{{ layout.AMOUNT_WORDS.top }}mm;
            left:{{ layout.AMOUNT_WORDS.left }}mm;
        "
    >
        {{ cheque.amount_in_words }}
    </div>

    {% if cheque.ac_payee_only %}

    <div
        class="field"
        style="
            top:{{ layout.AC_PAYEE.top }}mm;
            left:{{ layout.AC_PAYEE.left }}mm;
        "
    >
        ✓ A/C PAYEE ONLY
    </div>

    {% endif %}

</div>

</body>

</html>
