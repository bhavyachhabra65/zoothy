{% extends "base.html" %}

{% block title %}Print Cheque{% endblock %}

{% block styles %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/cheque.css') }}">
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cheque.js') }}"></script>
{% endblock %}

{% block content %}

<div class="z-page-header">

    <h1 class="z-title">

        Print Cheque

    </h1>

</div>

<form class="z-form" method="POST" action="{{ url_for('cheque.print_cheque') }}">

    <div class="z-row">

        <div class="z-form-group z-col-2">

            <label class="z-label">

                Bank

            </label>

            <select class="z-input" name="bank" required>

                <option>Select Bank</option>

            </select>

        </div>

        <div class="z-form-group z-col-1">

            <label class="z-label">

                Date

            </label>

            <input
                type="date"
                class="z-input"
                name="date"
                min="1900-01-01"
                max="2099-12-31"
                required>

        </div>

    </div>

    <div class="z-form-group z-field-full">

        <label class="z-label">
            Pay To
        </label>

        <input
            type="text"
            maxlength="100"
            class="z-input"
            name="pay_to"
            autocomplete="off"
            required>

    </div>

    <div class="z-row z-row-bottom">

    <div class="z-form-group z-field-medium">

        <label class="z-label">
            Amount
        </label>

        <input
            type="number"
            id="amount"
            class="z-input"
            name="amount"
            step="0.01"
            min="0.01"
            max="999999999.99"
            autocomplete="off"
            required>

    </div>

    <div class="z-form-group">

        <label class="z-label">
            &nbsp;
        </label>

        <label class="z-checkbox">

            <input
                type="checkbox"
                id="acPayee"
                name="ac_payee_only">

            <span>A/C Payee Only</span>

        </label>

    </div>

</div>

    <div class="z-actions">

        <button
            type="submit"
            class="z-button">

            Print

        </button>

    </div>

</form>

{% endblock %}
