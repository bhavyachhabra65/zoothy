{% extends "base.html" %}

{% block title %}Free Cheque Printing Software for India – Online Cheque Maker{% endblock %}

{% block styles %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/cheque.css') }}">
{% endblock %}

{% block content %}

<div class="z-page-heading">

    <h1 class="z-page-heading-title">
        Print Cheque
    </h1>

</div>

<form class="z-form" id="chequeForm" method="POST" action="{{ url_for('cheque.print_cheque') }}">

    <div class="z-row">

        <div class="z-form-group z-col-2">

            <label class="z-label">

                Bank

            </label>

        <select class="z-input" name="bank" required>

            <option value="">Select Bank</option>

            <option value="sbi">State Bank of India</option>
            <option value="hdfc">HDFC Bank</option>
            <option value="icici">ICICI Bank</option>
            <option value="axis">Axis Bank</option>
            <option value="kotak">Kotak Mahindra Bank</option>
            <option value="pnb">Punjab National Bank</option>
            <option value="bob">Bank of Baroda</option>
            <option value="boi">Bank of India</option>
            <option value="union">Union Bank</option>
            <option value="federal">Federal Bank</option>
            <option value="indusind">IndusInd Bank</option>
            <option value="bandhan">Bandhan Bank</option>
            <option value="ausmallfinance">AU Small Finance Bank</option>
            <option value="uco">UCO Bank</option>

        </select>
            

        </div>

        <div class="z-form-group z-col-1">

            <label class="z-label">

                Date

            </label>

            <input
                type="date"
                id="date"
                class="z-input"
                name="date"
                min="1900-01-01"
                max="2099-12-31"
                required>

        </div>

    </div>

    <div class="z-form-group z-field-full">

        <label class="z-label">
            Pay To
        </label>

        <input
            type="text"
            maxlength="100"
            class="z-input"
            name="pay_to"
            autocomplete="off"
            required>

    </div>

    <div class="z-row z-row-bottom">

        <div class="z-form-group z-field-medium">

            <label class="z-label">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                class="z-input"
                name="amount"
                step="0.01"
                min="0.01"
                max="999999999.99"
                autocomplete="off"
                required>

        </div>

        <div class="z-form-group z-checkbox-group">

            <label class="z-label">
                &nbsp;
            </label>

            <label class="z-checkbox">

                <input
                    type="checkbox"
                    id="acPayee"
                    name="ac_payee_only">

                <span>A/C Payee Only</span>

            </label>

        </div>

    </div>

    <div class="z-actions">

        <button
            type="submit"
            id="printButton"
            class="z-button">

            Print

        </button>

    </div>

</form>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/print-service.js') }}"></script>
<script src="{{ url_for('static', filename='js/cheque.js') }}"></script>
{% endblock %}
