services:
  web:
    build: .

    container_name: zoothy-web

    expose:
      - "8000"

    volumes:
      - .:/app

    env_file:
      - .env

    restart: unless-stopped

  nginx:
    image: nginx:latest

    container_name: zoothy-nginx

    ports:
      - "5000:80"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro

    depends_on:
      - web

    restart: unless-stopped