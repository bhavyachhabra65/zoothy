services:
  web:
    build:
      context: ../..

    container_name: zoothy-dev-web

    expose:
      - "8000"

    env_file:
      - ../../.env

    restart: unless-stopped

  nginx:
    image: nginx:latest

    container_name: zoothy-dev-nginx

    ports:
      - "8080:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../static:/app/static:ro

    depends_on:
      - web

    restart: unless-stopped