services:

  web:
    build:
      context: ../..

    container_name: zoothy-web

    expose:
      - "8000"

    env_file:
      - ../../.env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  postgres:
    image: postgres:17

    container_name: zoothy-postgres

    environment:
      POSTGRES_DB: zoothy
      POSTGRES_USER: zoothy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - zoothy-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoothy -d zoothy"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  nginx:
    image: nginx:latest

    container_name: zoothy-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../static:/app/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - web

    restart: unless-stopped


volumes:

  zoothy-postgres-data: