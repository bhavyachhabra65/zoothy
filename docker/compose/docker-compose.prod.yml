services:
  web:
    build:
      context: ../..

    container_name: zoothy-web

    expose:
      - "8000"

    env_file:
      - ../../.env

    restart: unless-stopped

nginx:
  image: nginx:latest

  container_name: zoothy-nginx

  ports:
    - "80:80"
    - "443:443"

  volumes:
    - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ../../static:/app/static:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro

  depends_on:
    - web

  restart: unless-stopped