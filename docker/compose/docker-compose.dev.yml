services:

  web:
    build:
      context: ../..

    container_name: zoothy-dev-web

    expose:
      - "8000"

    volumes:
      - ../../:/app

    env_file:
      - ../../.env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  postgres:
    image: postgres:17

    container_name: zoothy-dev-postgres

    environment:
      POSTGRES_DB: zoothy
      POSTGRES_USER: zoothy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - zoothy-dev-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoothy -d zoothy"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  nginx:
    image: nginx:latest

    container_name: zoothy-dev-nginx

    ports:
      - "5000:80"

    volumes:
      - ../nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../static:/app/static:ro

    depends_on:
      - web

    restart: unless-stopped


volumes:

  zoothy-dev-postgres-data: