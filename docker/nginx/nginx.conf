server {

    listen 80;

    server_name zoothy.com www.zoothy.com;

    return 301 https://zoothy.com$request_uri;

}

server {

    listen 443 ssl;

    server_name www.zoothy.com;

    ssl_certificate /etc/letsencrypt/live/zoothy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zoothy.com/privkey.pem;

    return 301 https://zoothy.com$request_uri;

}

server {

    listen 443 ssl;

    server_name zoothy.com;

    ssl_certificate /etc/letsencrypt/live/zoothy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zoothy.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {

        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

    }

    location /static/ {

        alias /app/static/;

        expires 30d;
        access_log off;

    }

}